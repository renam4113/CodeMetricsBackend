version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: codemetrics-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_CTX: "2048"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dev-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: codemetrics-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    entrypoint: ["/bin/sh", "-c", "echo Pulling $${OLLAMA_MODEL}... && ollama pull $${OLLAMA_MODEL} && echo Model ready."]
    restart: "no"
    networks:
      - dev-network

  gitea-db:
    image: postgres:15
    container_name: gitea-postgres
    restart: always
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea
      POSTGRES_DB: gitea
    volumes:
      - gitea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__DOMAIN: localhost
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - dev-network

  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-REPLACE_AFTER_GITEA_SETUP}
      GITEA_RUNNER_NAME: codemetrics-runner
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://mcr.microsoft.com/dotnet/sdk:8.0
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["daemon", "--container-network", "codemetrics-dev-network"]
    networks:
      - dev-network

  sonarqube-db:
    image: postgres:12
    container_name: sonarqube-postgres
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q UP"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - dev-network

  backend:
    build:
      context: ./CodeMetrics
      dockerfile: Dockerfile
    container_name: codemetrics-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: ${OLLAMA_MODEL:-phi3:mini}
      Ollama__Analysis__NumPredict: "280"
      Ollama__Analysis__NumCtx: "2048"
      Ollama__Quick__NumPredict: "180"
      Ollama__Quick__NumCtx: "1536"
      ConnectionStrings__Default: ${DATABASE_CONNECTION_STRING}
      Gitea__BaseUrl: ${GITEA_BASE_URL:-http://gitea:3000/api/v1}
      Gitea__AccessToken: ${GITEA_ACCESS_TOKEN:-}
      Gitea__Owner: ${GITEA_OWNER:-admin}
      SonarQube__BaseUrl: http://sonarqube:9000
      SonarQube__Token: ${SONAR_TOKEN:-}
      SonarQube__ProjectKey: ${SONAR_PROJECT_KEY:-renamshina}
      SonarQube__ScannerPath: sonar-scanner
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      sonarqube:
        condition: service_healthy
    networks:
      - dev-network

volumes:
  ollama_data:
  gitea_postgres_data:
  gitea_data:
  runner_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgresql_data:

networks:
  dev-network:
    name: codemetrics-dev-network
    driver: bridge
